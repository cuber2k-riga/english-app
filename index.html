<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Английский Дани</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, bottom tab bar, full-screen lesson runner over it. Dark-only by user choice. */
:root{
  --bg:#0E1316; --surface:#161D21; --surface2:#1F282D; --line:#2B363C;
  --fg:#E9EEEC; --muted:#8D9B9F; --accent:#F0B44C; --accent-ink:#1B1405; --accent-bg:rgba(240,180,76,.13);
  --good:#5CC28A; --bad:#E4695A; --warn:#E3C35C; --good-bg:rgba(92,194,138,.14); --bad-bg:rgba(228,105,90,.14);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:18px 96px;min-height:100%}
.app.runner{padding-bottom:28px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:var(--r);background:var(--surface2);font-weight:600;width:100%;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{min-height:40px;padding:8px 14px;font-size:14px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn svg{width:20px;height:20px;flex:none}
.panel{background:var(--surface);border-radius:var(--r);padding:16px}

/* Home */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.proto{font-size:11px;padding:4px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);white-space:nowrap}
.now{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.now .panel{padding:14px;min-width:0}
.now .val{font-weight:700;margin-top:4px}
.bar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.plan{display:flex;flex-direction:column}
.plan button{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.plan button:last-child{border-bottom:0}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.dot.done{background:var(--good);border-color:var(--good);color:var(--bg)}
.dot.cur{border-color:var(--accent)}
.plan .t{font-weight:600}
.plan .d{font-size:13px;color:var(--muted)}
.plan .m{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.extras{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.xbtn{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:var(--r);border:1px dashed var(--line);min-width:0}
.xbtn b{font-size:15px}
.xbtn span{font-size:13px;color:var(--muted)}
.xbtn.wide{grid-column:1/-1;border-style:solid;background:var(--surface)}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{padding:10px 2px 12px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button.on{color:var(--accent)}
.tabs svg{width:22px;height:22px}

/* Runner */
.rtop{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.x{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;flex:none;font-size:20px}
.x[disabled]{opacity:.3;pointer-events:none}
.x svg{width:18px;height:18px}
.rprog{flex:1;height:8px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-left:4px}
.rprog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.rlabel{font-size:12px;color:var(--muted);white-space:nowrap}
.q{min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:10px;margin-bottom:18px}
.q .big{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.q .mid{font-size:22px;font-weight:600;line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{min-height:54px;padding:12px 16px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);text-align:left;font-size:17px;font-weight:500}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .sub{color:var(--fg);font-weight:400;margin-top:4px}
.why{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.why .it{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:15px}
.why .it b{display:block}
.why .mk{font-weight:700}
.why .mk.g{color:var(--good)} .why .mk.r{color:var(--bad)}
.foot{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.spk{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:14px;font-weight:600;width:max-content;max-width:100%}
.spk svg{width:16px;height:16px;flex:none}
.w{border-bottom:1px dashed var(--muted);cursor:pointer}
.w:hover{color:var(--accent)}
.tip{position:fixed;z-index:20;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:14px;font-weight:600;pointer-events:none;max-width:240px}
.card{background:var(--surface);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.card .ru{font-size:18px;color:var(--muted)}
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.sec{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.parts{display:flex;flex-direction:column;gap:8px}
.part{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.part code{font-family:var(--f-body);font-weight:700;color:var(--accent);background:var(--accent-bg);padding:2px 8px;border-radius:6px;white-space:nowrap}
.pit{background:var(--bad-bg);border-radius:12px;padding:12px 14px;font-size:15px}
.pit b{color:var(--bad)}

/* Build */
.sent{min-height:70px;background:var(--surface);border-radius:var(--r);padding:14px 16px;font-size:20px;font-weight:600;line-height:1.4;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:0 .3em;align-items:center}
.sent .new{color:var(--accent)}
.sent .caret{display:inline-block;width:2px;height:1.2em;background:var(--accent);animation:blink 1s steps(1) infinite}
.sent .ph{color:var(--muted);font-weight:400;font-size:15px}
.sent .tk{background:var(--surface2);border-radius:8px;padding:2px 8px;cursor:pointer}
@keyframes blink{50%{opacity:0}}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.tok{padding:11px 15px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:17px;font-weight:500}
.tok.used{visibility:hidden}
.tok.shake{animation:shake .35s;border-color:var(--bad);background:var(--bad-bg)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hintline{margin-top:12px;font-size:15px;color:var(--muted)}
.hintline b{color:var(--fg)}

/* Theory */
.theory{display:flex;flex-direction:column;gap:14px}
.lead{font-size:17px;line-height:1.5}
mark{background:var(--accent-bg);color:var(--accent);padding:0 4px;border-radius:4px;font-weight:600}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split .panel{display:flex;flex-direction:column;gap:6px;min-width:0}
.panel.hl{border:1.5px solid var(--accent)}
.fbig{font-family:var(--f-display);font-size:22px;font-weight:700}
.fbig .s{color:var(--accent);font-size:1.25em;text-decoration:underline;text-underline-offset:4px}
.fbig .gone{color:var(--bad);text-decoration:line-through}
.rule{border-left:3px solid var(--accent);padding:4px 0 4px 12px;font-size:15px}
.exl{display:flex;flex-direction:column;gap:10px}
.exl div{display:flex;flex-direction:column}
.exl b{font-weight:600}
.exl span{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:rgba(227,195,92,.14);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.center{text-align:center;align-items:center}
.score{font-family:var(--f-display);font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.tbl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.tbl b{font-weight:700}

/* Stats, dict */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.statgrid div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
.statgrid b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.statgrid span{font-size:12px;color:var(--muted)}
.tense{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tense:last-child{border-bottom:0}
.tense .bar{grid-column:1/-1;margin-top:0}
.tense.locked{opacity:.4}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li .en{font-weight:600}
.li .ru{font-size:14px;color:var(--muted)}
.li .acts{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
input[type=text]{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:inherit}
textarea{width:100%;min-height:320px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:14px;line-height:1.5;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:110px;min-width:0}
.tile .t{font-weight:700}
.tile .d{font-size:13px;color:var(--muted)}
.flip{min-height:250px;cursor:pointer;justify-content:center;text-align:center;align-items:center}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;font-size:14px;max-width:90vw}
a{color:var(--accent)}
/* Flip card */
.fcard{min-height:300px;cursor:pointer;border:1.5px solid var(--line);transition:border-color .2s}
.fcard.is-back{border-color:var(--accent)}
.fc-front{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding-block:30px}
.big-en{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.fc-ru{font-size:22px;font-weight:600}
.fc-tr{font-size:18px;color:var(--accent);letter-spacing:.02em}
/* Dictionary folders */
.folders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.folder{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:6px 10px;text-align:left;background:var(--surface);border-radius:var(--r);padding:14px;min-width:0;position:relative}
.folder .ficon{width:36px;height:36px;border-radius:10px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;grid-row:1/3}
.folder .ficon svg{width:20px;height:20px}
.folder b{display:block;font-size:14px;letter-spacing:-.01em;overflow-wrap:anywhere}
.folder{grid-template-columns:30px 1fr}.folder .ficon{width:30px;height:30px}
.folder span span{font-size:12px;color:var(--muted)}
.folder > span:nth-child(2) span{display:block;font-size:12px;color:var(--muted);line-height:1.3}
.fcount{grid-column:2;font-size:12px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.assoc-in{min-height:90px;font-size:15px;background:var(--surface2)}
.assoc-txt{font-size:16px;background:var(--accent-bg);border-radius:10px;padding:10px 12px}
@media (max-width:360px){.folders{grid-template-columns:1fr}}

/* Mistakes */
.ecard{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.eq{font-weight:600}
.ey,.er{display:grid;grid-template-columns:52px 1fr;gap:8px;font-size:15px}
.ey span,.er span{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;padding-top:3px}
.ey{color:var(--bad)} .er{color:var(--good)}
.ew{font-size:14px;background:var(--surface2);border-radius:10px;padding:10px 12px}
details summary{list-style:none} details summary::-webkit-details-marker{display:none}
/* Path */
.pathcard{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.pathcard b{display:block;font-size:15px;margin-top:2px}
.stage{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r);padding:12px 14px;margin-top:22px}
.stage b{display:block;font-family:var(--f-display);font-size:14px}
.stage span{font-size:12px;color:var(--muted)}
.stage.scur{background:var(--accent);color:var(--accent-ink)} .stage.scur span,.stage.scur .chip{color:var(--accent-ink)} .stage.scur .chip{background:rgba(0,0,0,.14)}
.stage.sdone{background:var(--good-bg)}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:18px 4px}
.pstep{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;width:150px}
.pnode{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);box-shadow:0 5px 0 #0a0e10;flex:none}
.pnode svg{width:26px;height:26px}
.pnode.done{background:var(--good);color:var(--bg);box-shadow:0 5px 0 #3b8a5f}
.pnode.cur{width:74px;height:74px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 #a8792a,0 0 0 7px var(--accent-bg)}
.pnode.cur svg{width:32px;height:32px}
.pnode.small{width:36px;height:36px;box-shadow:none;font-family:var(--f-display);font-weight:700;font-size:14px}
.pnode.trophy{border-radius:18px}
.pnode.trophy.lock{color:var(--muted)}
.pnode:active{transform:translateY(3px)}
.plabel{text-align:center;display:flex;flex-direction:column;max-width:150px}
.plabel b{font-size:13px}
.plabel span{font-size:11px;color:var(--muted);line-height:1.25}
.pbubble{background:var(--fg);color:var(--bg);font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;position:relative;margin-bottom:4px;animation:bob 1.6s ease-in-out infinite}
.pbubble:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--fg)}
@keyframes bob{50%{transform:translateY(-4px)}}
[hidden]{display:none!important}
.kchips{display:flex;flex-wrap:wrap;gap:8px}
.kchip{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--line);text-align:left}
.kchip b{font-size:15px}
.kchip span{font-size:12px;color:var(--muted)}
.kchip.on{border-color:var(--good);background:var(--good-bg)}
.kchip.on b{color:var(--good)}
.xbtn.lwt{border-style:solid;border-color:var(--accent);background:var(--accent-bg)}
.xbtn.lwt b{color:var(--accent)}
.onb{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;padding:14px 16px;border-radius:var(--r);background:var(--good-bg);border:1.5px solid var(--good);margin-bottom:10px}
.onb b{color:var(--good)} .onb span{font-size:13px;color:var(--fg)}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gstats div{background:var(--surface);border-radius:12px;padding:10px;text-align:center}
.gstats b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.gstats span{font-size:11px;color:var(--muted);line-height:1.2;display:block}
/* Grammar */
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border-radius:var(--r);padding:14px}
.gnum{width:30px;height:30px;border-radius:9px;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:13px;font-weight:700}
.gitem b{display:block}
.gitem span{font-size:13px;color:var(--muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-16px;padding-inline:16px}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.cur{background:var(--accent-bg)}
table.t .f{font-weight:700}
.tgrid{min-width:560px}
.tcard{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.tcard.now{border:1.5px solid var(--accent)}
.tcard .nm{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.tcard .nm b{font-family:var(--f-display);font-size:16px}
.tcard .runame{color:var(--accent);font-weight:600;font-size:14px}
.tcard code{font-family:var(--f-body);font-weight:700;background:var(--surface2);padding:2px 8px;border-radius:6px}
.snd{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.snd:last-child{border-bottom:0}
.snd .sym{font-size:24px;font-weight:700;color:var(--accent);text-align:center;background:var(--surface2);border-radius:10px;padding:6px 0}
.pyr{display:flex;flex-direction:column;align-items:center;gap:6px}
.pyr div{border-radius:10px;padding:10px 12px;text-align:center;font-size:14px}
.pyr .p1{width:46%;background:var(--accent);color:var(--accent-ink)}

    try{const s=window.speechSynthesis;if(!s){toast("Озвучка недоступна в этом браузере");return res()}
      s.cancel();const u=new SpeechSynthesisUtterance(text.replace(/…/g,""));u.lang=lang;
      const v=s.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith(lang.slice(0,2)));if(v)u.voice=v;
      u.rate=lang.startsWith("en")?.9:1;let done=false;const fin=()=>{if(!done){done=true;res()}};
      u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(2500,text.length*120));s.speak(u);
    }catch(e){res()}
  });
}

/* ================= TASK BUILDERS ================= */
const others=(pool,excl,key,n=3)=>shuffle(pool.filter(x=>x!==excl&&x.ru!==excl.ru&&x.en!==excl.en)).slice(0,n).map(x=>x[key]);
function wordQ(w,kind,extra={}){
  if(kind==="en2ru"){const o=shuffle([w.ru,...others(w.pool||WORDS,w,"ru")]);return {type:"choice",hint:"Выбери перевод",prompt:w.en,say:w.en,options:o,answer:o.indexOf(w.ru),wordId:w.id,...extra}}
  if(kind==="ru2en"){const o=shuffle([w.en,...others(w.pool||WORDS,w,"en")]);return {type:"choice",hint:"Как по-английски?",prompt:w.ru,ru:true,options:o,answer:o.indexOf(w.en),sayAfter:w.en,wordId:w.id,...extra}}
  if(kind==="audio"){const o=shuffle([w.en,...others(w.pool||WORDS,w,"en")]);return {type:"choice",hint:"Какое слово прозвучало?",audio:w.en,options:o,answer:o.indexOf(w.en),wordId:w.id,...extra}}
  if(kind==="say")return {type:"say",ru:w.exRu,en:w.ex,wordId:w.id,...extra};
}
const consQ=c=>({type:"choice",hint:"Что подходит по смыслу?",prompt:c.q.situation,ru:true,options:c.q.options,answer:c.q.answer,notes:c.q.notes,consId:c.id,sayAfter:c.q.options[c.q.answer]});
const consBuild=(c,b)=>({type:"build",hint:"Собери фразу",...b,consId:c.id});
const fillSay=(c,f)=>({type:"say",ru:f[1],en:f[0],consId:c.id,pit:c.pitPlain});
const fillBuild=(c,f)=>({type:"build",hint:"Собери фразу",ru:f[1],chunks:chunkify(f[0],c.say),en:f[0],consId:c.id,why:c.simple});
CONS.forEach(c=>c.pitPlain=c.pit.replace(/<[^>]+>/g,""));
/* «Я уже это знаю»: 2 быстрых вопроса без подсказок. Оба верно — конструкция выучена и больше не учится */
const consCheck=c=>[{...consQ(c),knownCheck:true,hint:"Быстрая проверка · 1 из 2"},{...consBuild(c,c.builds[1]),knownCheck:true,kcFinal:true,hint:"Быстрая проверка · 2 из 2",why:""}];
function consLesson(c){return [{type:"ccard",cons:c,canKnow:true},consQ(c),consBuild(c,c.builds[0]),fillSay(c,c.fills[0]),consBuild(c,c.builds[1]),fillSay(c,c.fills[2])]}

/* ================= RUNNER ================= */
let runnerLite=false;
function showTabs(on){$("#tabs").hidden=!on;view.classList.toggle("runner",!on)}
function topBar(pct,label,canBack){return `<div class="rtop"><button class="x" id="close" aria-label="Закрыть">×</button>${canBack===undefined?"":`<button class="x" id="back" aria-label="Назад" ${canBack?"":"disabled"}>${BACK}</button>`}<div class="rprog"><i style="width:${pct}%"></i></div><div class="rlabel">${esc(label)}</div></div>`}
function bindTop(cb){$("#close").onclick=()=>{stopSpeech();go("home")};const b=$("#back");if(b&&cb)b.onclick=()=>{stopSpeech();cb({back:true})}}

function runBlock({title,phases,onFinish,lite=false}){
  showTabs(false);runnerLite=lite;let pi=0;
  const next=()=>{if(pi>=phases.length){onFinish&&onFinish(phases);return}
    const ph=phases[pi];const go_=()=>runPhase(ph,()=>{pi++;next()});
    if(ph.intro)introScreen(ph.intro,go_);else go_()};
  function introScreen(intro,start){
    view.innerHTML=`${topBar(0,title)}<div class="stack center" style="padding-top:36px">
      <div class="eyebrow">${esc(intro.eyebrow||"")}</div><h1>${esc(intro.title)}</h1><p class="muted" style="max-width:34ch">${esc(intro.text)}</p></div>
      <div class="foot"><button class="btn primary" id="go">Начать</button></div>`;
    bindTop();$("#go").onclick=start}
  function runPhase(ph,done){
    const queue=(typeof ph.tasks==="function"?ph.tasks():ph.tasks).slice();
    const hist=[];let correct=0,graded=0;const kcFail={};
    const step=()=>{
      if(!queue.length){ph.result={correct,graded,pct:graded?Math.round(correct/graded*100):100};return done()}
      const t=queue.shift();const pct=hist.length/(hist.length+queue.length+1)*100;
      renderTask(t,ph.mode,pct,ph.mode==="test"?"Тест":title,hist.length>0,res=>{
        if(res.back){queue.unshift(t);const e=hist.pop();
          if(e.counted){graded--;if(e.res.ok)correct--}
          e.added.forEach(a=>{const i=queue.indexOf(a);if(i>=0)queue.splice(i,1)});
          e.t._again=true;queue.unshift(e.t);return step()}
        const entry={t,res,added:[],counted:false};
        if(res.graded){
          if(!t._retry&&!t.knownCheck){graded++;if(res.ok)correct++;entry.counted=true}
          if(!t._again){record(t,res.ok,ph.mode);if(!runnerLite&&!t.knownCheck)(res.ok?logRight(t):logError(t,res.picked||""))}
          if(!res.ok&&ph.mode==="train"&&!t._retry&&!t.knownCheck&&!res.noRetry){const r={...t,_retry:true,_again:false};queue.push(r);entry.added.push(r)}
          if(t.knownCheck){const k=t.wordId||t.consId;
            if(!res.ok){kcFail[k]=true;if(t.kcFinal)toast("Не совсем — пройдём как обычно")}
            else if(t.kcFinal&&!kcFail[k]){const st=t.wordId?wStat(t.wordId):cStat(t.consId);st.status="learned";st.known=true;st.at=Date.now();save();
              for(let i=queue.length-1;i>=0;i--)if(k===(queue[i].wordId||queue[i].consId))queue.splice(i,1);toast("Засчитано как выученное")}}
        }
        if(res.insert){const ins=[].concat(res.insert);queue.unshift(...ins);entry.added.push(...ins)}
        hist.push(entry);step();
      });
    };
    step();
  }
  next();
}

function record(t,ok,mode){
  if(runnerLite)return;
  if(t.wordId){const s=wStat(t.wordId);ok?s.ok++:s.bad++;if(s.status==="new"){s.status="learning";s.at=Date.now()}if(mode==="test"&&!ok)addMistake("word",t.wordId)}
  if(t.consId){const s=cStat(t.consId);ok?s.ok++:s.bad++;if(s.status==="new"){s.status="learning";s.at=Date.now()}if(mode==="test"&&!ok)addMistake("cons",t.consId)}
  if(t.tenseId){if(!S.tense.ps.at)S.tense.ps.at=Date.now();const a=S.tense.ps.answers;a.push(ok?1:0);if(a.length>30)a.shift();if(mode==="test"&&!ok)addMistake("tense",t.tenseId)}
  save();
}

function whyList(t,picked){
  if(!t.notes)return "";
  return `<div class="why">${t.options.map((o,i)=>`<div class="it"><span class="mk ${i===t.answer?"g":"r"}">${i===t.answer?"✓":"✗"}</span><div><b>${esc(o)}</b><span class="muted">${esc(t.notes[i])}</span>${i===picked&&i!==t.answer?' <span class="chip bad">твой ответ</span>':""}</div></div>`).join("")}</div>`;
}

function renderTask(t,mode,pct,label,canBack,cb){
  if(t.knownCheck)mode="test"; /* быстрая проверка — без подсказок */
  const hints=mode!=="test";
  const top=topBar(pct,label,canBack);
  if(t.type==="theory"){
    view.innerHTML=`${top}<div class="theory">${t.html}</div><div class="foot"><button class="btn primary" id="n">Понятно, дальше</button></div>`;
    bindTop(cb);$("#n").onclick=()=>cb({});return}
  if(t.type==="card"){
    const w=t.word;let back=false;
    const draw=()=>{
      view.innerHTML=`${top}<div class="card fcard ${back?"is-back":""}" id="fc" role="button" tabindex="0" aria-label="Перевернуть карточку">
        <div class="row" style="justify-content:space-between"><div class="eyebrow">${back?"Перевод":"Новое слово"}</div><span class="chip">${back?"↺ лицо":"↻ перевернуть"}</span></div>
        ${back?`
          <div class="big-en">${esc(w.en)}</div>
          <div class="fc-ru">${esc(w.ru)}</div>
          <div class="fc-tr">${esc(w.tr)}</div>
          ${spkBtn(w.en)}
          <div class="ex"><div style="font-size:17px">${tt(w.ex)}</div><div class="muted">${esc(w.exRu)}</div>${spkBtn(w.ex,"Фраза")}</div>
          <div id="assoc"></div>`
        :`<div class="fc-front"><div class="big-en">${esc(w.en)}</div>${spkBtn(w.en)}<div class="muted" style="font-size:14px">Вспомни перевод и нажми на карточку</div></div>`}
      </div>
      <div class="foot">${back?`<button class="btn primary" id="n">Дальше</button>`:`<button class="btn primary" id="flip">Перевернуть</button><button class="btn ghost" id="k">Я знаю это слово</button>`}</div>`;
      bindTop(cb);
      const flip=()=>{back=!back;draw()};
      $("#fc").onclick=e=>{if(e.target.closest("[data-say],.w"))return;flip()};
      $("#fc").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
      if(back){$("#n").onclick=()=>cb({});assocBlock(w,$("#assoc"))}
      else{$("#flip").onclick=flip;$("#k").onclick=()=>cb({insert:wordQ(w,"ru2en",{knownCheck:true,kcFinal:true,hint:"Быстрая проверка"})})}
    };
    draw();return}
  if(t.type==="ccard"){
    const c=t.cons;
    view.innerHTML=`${top}<div class="card">
      <div class="eyebrow">Новая конструкция · ${CONS.indexOf(c)+1} из ${CONS.length}</div>
      <div style="font-family:var(--f-display);font-size:26px;font-weight:700">${esc(c.en)}</div>
      <div class="ru">${esc(c.ru)}</div>
      ${spkBtn(c.say,"Озвучить конструкцию")}
      <div class="sec"><div class="eyebrow">Простыми словами</div><p>${esc(c.simple)}</p></div>
      <div class="sec"><div class="eyebrow">Разбор по частям</div><div class="parts">${c.grammar.map(g=>`<div class="part"><code>${esc(g[0])}</code><span>${esc(g[1])}</span></div>`).join("")}</div></div>
      <div class="pit">${c.pit}</div>
      <div class="sec"><div class="eyebrow">Примеры</div></div>
      ${c.ex.map(e=>`<div class="ex" style="border:0;padding-top:0"><div style="font-size:17px">${tt(e[0])}</div><div class="muted">${esc(e[1])}</div>${spkBtn(e[0])}</div>`).join("")}
    </div><div class="foot"><button class="btn primary" id="n">Понятно, тренировать</button>${t.canKnow?`<button class="btn ghost" id="k">Я уже это знаю</button>`:""}</div>`;
    bindTop(cb);$("#n").onclick=()=>cb({});
    if(t.canKnow)$("#k").onclick=()=>cb({insert:consCheck(c)});return}
  if(t.type==="choice"){
    const prompt=t.audio?`<button class="btn" id="play" style="width:auto;align-self:flex-start">${SPK} Прослушать ещё раз</button>`
      :`<div class="${t.prompt.length>28?"mid":"big"}">${t.ru?esc(t.prompt):tt(t.prompt,hints)}</div>${t.say&&hints?spkBtn(t.say):""}`;
    view.innerHTML=`${top}<div class="q"><div class="eyebrow">${esc(t.hint||"")}</div>${prompt}</div>
      <div class="opts">${t.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div><div id="after"></div>`;
    bindTop(cb);
    if(t.audio){speak(t.audio);$("#play").onclick=()=>speak(t.audio)}
    view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i,ok=i===t.answer;
      view.querySelectorAll(".opt").forEach(x=>x.disabled=true);
      const picked=t.options[i];
      if(mode==="test"){b.classList.add("ok");setTimeout(()=>cb({graded:true,ok,picked}),250);return}
      b.classList.add(ok?"ok":"no");view.querySelectorAll(".opt")[t.answer].classList.add("ok");
      if(t.sayAfter)speak(t.sayAfter);
      if(ok&&!t.notes){setTimeout(()=>cb({graded:true,ok,picked}),650);return}
      $("#after").innerHTML=`<div class="fb ${ok?"ok":"no"}">${ok?"Верно":"Неверно"}</div>${t.notes?`<div class="panel" style="margin-top:10px"><div class="eyebrow">Разбор вариантов</div>${whyList(t,i)}</div>`:`<div class="fb no" style="margin-top:8px"><div class="sub">Правильно: <b>${esc(t.options[t.answer])}</b></div></div>`}
        <div class="foot"><button class="btn primary" id="n">Дальше</button></div>`;
      $("#n").onclick=()=>cb({graded:true,ok,picked});
    });
    return}
  if(t.type==="build"){
    const chunks=t.chunks,full=sentence(t);
    const tiles=shuffle([...chunks.map((c,i)=>({txt:c,real:i})),...(t.extra||[]).map(c=>({txt:c,real:-1}))]);
    view.innerHTML=`${top}<div class="q" style="min-height:90px"><div class="eyebrow">${esc(t.hint||"Собери фразу")}</div><div class="mid">${esc(t.ru)}</div></div>
      <div class="sent" id="sent"></div><div class="pool" id="pool">${tiles.map((x,i)=>`<button class="tok" data-i="${i}">${esc(x.txt)}</button>`).join("")}</div>
      <div id="hl"></div><div id="after"></div>`;
    bindTop(cb);
    if(mode==="test"){ /* free order, check at the end */
      let picked=[];
      $("#after").innerHTML=`<div class="foot"><button class="btn primary" id="chk" disabled>Проверить</button></div>`;
      const draw=()=>{$("#sent").innerHTML=picked.length?picked.map((i,k)=>`<span class="tk" data-k="${k}">${esc(tiles[i].txt)}</span>`).join(""):`<span class="ph">Нажимай на слова по порядку</span>`;
        view.querySelectorAll("#pool .tok").forEach(b=>b.classList.toggle("used",picked.includes(+b.dataset.i)));
        $("#chk").disabled=!picked.length;
        view.querySelectorAll("#sent .tk").forEach(b=>b.onclick=()=>{picked.splice(+b.dataset.k,1);draw()})};
      view.querySelectorAll("#pool .tok").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(!picked.includes(i)){picked.push(i);draw()}});
      $("#chk").onclick=()=>{const got=picked.map(i=>tiles[i].txt).join(" ");cb({graded:true,ok:got===chunks.join(" "),picked:got})};
      draw();return}
    /* training: the next right piece snaps onto the sentence, a wrong one shakes and explains */
    let pos=0,errs=0,firstWrong="";
    const draw=()=>{$("#sent").innerHTML=chunks.slice(0,pos).map((c,i)=>`<span class="${i===pos-1?"new":""}">${esc(c)}</span>`).join("")+(pos<chunks.length?'<span class="caret"></span>':"")};
    draw();
    $("#hl").innerHTML=`<button class="btn small ghost" id="hint" style="margin-top:14px">Подсказка: почему так</button>`;
    $("#hint").onclick=()=>{$("#hl").innerHTML=`<div class="hintline"><b>Подсказка:</b> ${esc(t.why||"")}</div>`};
    view.querySelectorAll("#pool .tok").forEach(b=>b.onclick=()=>{
      if(pos>=chunks.length)return;
      const x=tiles[+b.dataset.i];
      if(x.txt===chunks[pos]){b.classList.add("used");pos++;draw();
        if(pos===chunks.length){speak(full);
          $("#hl").innerHTML="";
          $("#after").innerHTML=`<div class="fb ${errs?"no":"ok"}">${errs?"Собрано, ошибок: "+errs:"Верно с первого раза"}<div class="sub"><b>${esc(full)}</b></div>${t.why?`<div class="sub" style="margin-top:6px">${esc(t.why)}</div>`:""}</div>
            <div class="foot"><button class="btn primary" id="n">Дальше</button></div>`;
          $("#n").onclick=()=>cb({graded:true,ok:errs===0,picked:firstWrong})}}
      else{if(!errs)firstWrong=`поставил «${x.txt}» там, где нужно «${chunks[pos]}»`;errs++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");
        $("#hl").innerHTML=`<div class="hintline">${x.real<0?"Это слово-ловушка. ":"Не сейчас, оно дальше. "}<b>Подсказка:</b> ${esc(t.why||"")}</div>`}
    });
    return}
  if(t.type==="say"){
    let tries=0;
    const ask=()=>{
      view.innerHTML=`${top}<div class="q"><div class="eyebrow">${tries?`Ещё раз, по памяти · попытка ${tries+1}`:"Скажи вслух по-английски"}</div><div class="mid">${esc(t.ru)}</div></div>
      <div id="after"><div class="foot"><button class="btn primary" id="show">Сказал, показать ответ</button></div></div>`;
      bindTop(cb);
      $("#show").onclick=()=>{speak(t.en);
        $("#after").innerHTML=`<div class="card"><div style="font-size:20px;font-weight:600">${tt(t.en)}</div>${spkBtn(t.en,"Ещё раз")}${t.pit?`<div class="pit" style="font-size:14px">${esc(t.pit)}</div>`:""}</div>
        <div class="foot">${runnerLite?`<button class="btn primary" id="n">Дальше</button><button class="btn ghost" id="no">Повторить эту фразу</button>`:
        `<button class="btn primary" id="y">Сказал так же</button><button class="btn ghost" id="no">Сказал иначе или забыл — повторить</button>`}</div>`;
        if(runnerLite){$("#n").onclick=()=>cb({});$("#no").onclick=()=>{tries++;ask()}}
        else{$("#y").onclick=()=>cb({graded:true,ok:tries===0,noRetry:true});$("#no").onclick=()=>{tries++;ask()}}
      };
    };
    ask();
  }
}

function resultScreen(title,phases,extra=""){
  showTabs(false);
  const tests=phases.filter(p=>p.mode==="test");const th=S.settings.threshold;
  const allDone=BLOCKS.every(b=>S.day.done[b.key]);

    <div class="eyebrow">${esc(title)}</div><h1>Блок пройден</h1>
    ${tests.map(p=>{const pass=p.result.pct>=th;return `<div class="panel" style="width:100%"><div class="score" style="color:${pass?"var(--good)":"var(--bad)"}">${p.result.pct}%</div>
      <div>${esc(p.name||"Тест")}: ${p.result.correct} из ${p.result.graded}</div><div class="muted">${pass?"Сдано":"Не сдано"} · порог ${th}%</div></div>`}).join("")}
    ${extra}</div><div class="foot">${allDone?`<button class="btn primary" id="gpt">День закрыт — промпт для ChatGPT</button><button class="btn ghost" id="home">На главную</button>`:`<button class="btn primary" id="home">На главную</button>`}</div>`;
  $("#home").onclick=()=>go("home");if(allDone)$("#gpt").onclick=gptScreen;

/* ================= BLOCKS ================= */
const BLOCKS=[
 {key:"check",name:"Проверка",desc:"Ошибки прошлых дней",min:10},
 {key:"words",name:"Слова",desc:TOPIC.title,min:25},
 {key:"cons",name:"Конструкции",desc:"5 штук, по одной",min:20},
 {key:"tense",name:"Времена",desc:"Present Simple",min:25},
 {key:"link",name:"Связка",desc:"Скажи вслух и собери фразу",min:10}
];
function finishBlock(key){S.day.done[key]=true;save()}
const tag=it=>({...it,tenseId:it.id});

function startBlock(key){
  if(key==="check"){
    const old=S.mistakes.filter(m=>m.date<today);
    if(!old.length){finishBlock("check");showTabs(false);
      view.innerHTML=`<div class="stack center" style="padding-top:60px"><h1>Проверять нечего</h1><p class="muted" style="max-width:32ch">Ошибок с прошлых дней нет. Ошибки из сегодняшних тестов появятся здесь завтра.</p></div><div class="foot"><button class="btn primary" id="home">Дальше</button></div>`;
      $("#home").onclick=()=>go("home");return}
    const tasks=old.map(m=>{
      if(m.kind==="word"){const w=ALLW().find(w=>w.id===m.id);return w&&wordQ(w,"ru2en")}
      if(m.kind==="cons"){const c=CONS.find(c=>c.id===m.id);return c&&consQ(c)}

    }).filter(Boolean);
    runBlock({title:"Проверка",phases:[{mode:"test",name:"Проверка ошибок",tasks:shuffle(tasks)}],onFinish:ph=>{
      S.mistakes=S.mistakes.filter(m=>m.date>=today);finishBlock("check");resultScreen("Проверка",ph)}});
    return}
  if(key==="words"){
    const batch=(b,n)=>({mode:"train",intro:{eyebrow:`Часть ${n} из 2`,title:"10 новых слов",text:"Сначала карточки, потом тренировка. Нажми на любое подчёркнутое слово во фразе, чтобы увидеть перевод."},
      tasks:()=>{const bb=b.filter(w=>wStat(w.id).status!=="learned");
        return [...bb.map(w=>({type:"card",word:w})),...shuffle(bb.map(w=>wordQ(w,"en2ru"))),
          ...shuffle([...bb.map(w=>wordQ(w,"ru2en")),...bb.map(w=>wordQ(w,"audio"))]),...shuffle(bb).slice(0,4).map(w=>wordQ(w,"say"))]}});
    runBlock({title:"Слова",phases:[batch(WORDS.slice(0,10),1),batch(WORDS.slice(10,20),2),
      {mode:"test",name:"Тест по словам дня",intro:{eyebrow:"Тест",title:"Все слова дня",text:"Без подсказок и без второй попытки. Ошибки уйдут в завтрашнюю проверку."},
       tasks:()=>shuffle(WORDS).map((w,i)=>wordQ(w,i%2?"en2ru":"ru2en",{sayAfter:null}))}],
      onFinish:ph=>{finishBlock("words");const pass=ph[2].result.pct>=S.settings.threshold;

        resultScreen("Слова",ph,pass?`<p class="muted" style="max-width:34ch">Тема «About Me» пройдена — на карте пути открылась следующая.</p>`:"")}});
    return}
  if(key==="cons"){
    const todo=TOPIC_CONS.filter(c=>cStat(c.id).status!=="learned");
    if(!todo.length){finishBlock("cons");showTabs(false);
      view.innerHTML=`<div class="stack center" style="padding-top:60px"><h1>Все конструкции уже знаешь</h1><p class="muted" style="max-width:32ch">Все конструкции этой темы отмечены как изученные. Их можно прогнать в тренажёре.</p></div><div class="foot"><button class="btn primary" id="home">Дальше</button></div>`;
      $("#home").onclick=()=>go("home");return}
    runBlock({title:"Конструкции",phases:[
      ...todo.map((c,i)=>({mode:"train",intro:i===0?{eyebrow:`${todo.length} из ${TOPIC_CONS.length} конструкций темы`,title:"По одной за раз",text:"Разбираем конструкцию, закрепляем, и только потом следующая. Если уже знаешь её — нажми «Я уже это знаю»."}:null,tasks:()=>cStat(c.id).status==="learned"?[]:consLesson(c)})),
      {mode:"test",name:"Тест по конструкциям",intro:{eyebrow:"Большой тест",title:"Все конструкции урока",text:"Без подсказок и без второй попытки. Отмеченные как изученные сюда не входят."},
       tasks:()=>{const left=todo.filter(c=>cStat(c.id).status!=="learned");const set=left.length?left:todo;return shuffle([...set.map(consQ),...set.map(c=>consBuild(c,c.builds[1]))])}}],
      onFinish:ph=>{finishBlock("cons");resultScreen("Конструкции",ph)}});
    return}
  if(key==="tense"){
    const st=S.tense.ps.stage,th=S.settings.threshold;

      runBlock({title:"Времена",phases:[{mode:"test",name:"Накопительный тест",intro:{eyebrow:"Present Simple закрыто",title:"Накопительный тест",text:"Все пройденные времена вперемешку. В прототипе пока одно время."},tasks:()=>shuffle(TI.filter(t=>t.type!=="say")).slice(0,10).map(tag)}],
        onFinish:ph=>{finishBlock("tense");resultScreen("Времена",ph,`<p class="muted">Следующее время, Present Continuous, появится в полной версии.</p>`)}});
      return}
    const round=st+1;
    const trainTasks=round===1
      ?PS_STEPS.flatMap(s=>[{type:"theory",html:s.theory},...s.tasks.map(id=>tag(TENSE_ITEMS[id]))])
      :(()=>{const miss=S.mistakes.filter(m=>m.kind==="tense").map(m=>TENSE_ITEMS[m.id]).filter(Boolean);
         const base=TI.filter(t=>!t.id.startsWith("x"));
         return [{type:"theory",html:PS_SHEET},...shuffle([...new Set([...miss,...shuffle(base)])]).slice(0,10).map(tag)]})();
    runBlock({title:"Времена",phases:[
      {mode:"train",intro:{eyebrow:`Present Simple · тренировка ${round}`,title:round===1?"Новое время":"Работа над ошибками",text:round===1?"5 коротких шагов: объяснение, потом сразу задания на него.":"Шпаргалка и задания, где ты ошибался."},tasks:trainTasks},
      {mode:"test",name:`Тест ${round}`,intro:{eyebrow:"Тест",title:`Тест ${round}: Present Simple`,text:`Без подсказок. Нужно ${th}% или больше.`},tasks:()=>shuffle(PS_TEST_IDS).map(id=>tag(TENSE_ITEMS[id]))}],
      onFinish:ph=>{const pass=ph[1].result.pct>=th;if(pass)S.tense.ps.stage=st+1;finishBlock("tense");save();
        resultScreen("Времена",ph,`<p class="muted" style="max-width:34ch">${pass?(st+1>=2?"Present Simple закрыто. Дальше накопительный тест.":"Отлично. Следующий шаг — тренировка 2 и тест 2."):"Не страшно: в следующий раз повторим ошибки и пересдадим."}</p>`)}});
    return}
  if(key==="link"){
    runBlock({title:"Связка",phases:[{mode:"train",intro:{eyebrow:"Связка",title:"Говорим целыми фразами",text:"Слова, конструкции и время вместе. Говори вслух, потом сверяйся."},tasks:LINK}],
      onFinish:ph=>{finishBlock("link");resultScreen("Связка",ph)}});
  }
}

  bindTop();

  view.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>runDrill(find(b.dataset.c)));

/* Вариант «что подходит»: та же заготовка, вставленная в другие конструкции с таким же местом */
function drillChoice(c,x){
  const others=shuffle(CONS.filter(o=>o!==c&&o.g!==c.g)).map(o=>{const t=o.tpl.find(t=>["A","B","P","D","N"].every(k=>!!x.cb[k]===t.en.includes("{"+k)&&(!x.cb.A||actOk(x.cb.A,t.need))));
    if(!t)return null;const en=t.en.replace(/\{(\w)(?:\.(\w+))?\}/g,(m,k,f)=>{const v=x.cb[k];return k==="A"||k==="B"?v[f||"b"]:v.en});return en===x.en?null:{en,o}}).filter(Boolean);
  const pickO=[];others.forEach(z=>{if(pickO.length<2&&!pickO.some(p=>p.en===z.en))pickO.push(z)});
  if(pickO.length<2)return null;
  const opts=shuffle([{en:x.en,o:c},...pickO]);
  return {type:"choice",hint:"Как это сказать?",prompt:x.ru,ru:true,options:opts.map(z=>z.en),answer:opts.findIndex(z=>z.o===c),consId:c.id,sayAfter:x.en,
    notes:opts.map(z=>z.o===c?`Верно: ${c.en} — «${c.ru}». ${c.simple}`:`${z.o.en} — это «${z.o.ru}». ${z.o.simple}`)};
}
function runDrill(c,useAll){
  const known=genPhrases(c,true);
  if(!useAll&&known.length<5){showTabs(false);const all=genPhrases(c,false).length;
    view.innerHTML=`${topBar(0,c.en)}<div class="stack center" style="padding-top:30px"><div class="eyebrow">Тренажёр</div><h1>Мало знакомых слов</h1>
      <p class="muted" style="max-width:34ch">Для ${esc(c.en)} из твоих слов собирается ${known.length} ${plural(known.length,"фраза","фразы","фраз")}. Отметь слова, которые уже знаешь, и фраз станет больше. Всего для этой конструкции есть ${all}.</p></div>
      <div class="foot"><button class="btn primary" id="mk">Отметить слова, которые я знаю</button><button class="btn ghost" id="all">Прогнать на всех словах</button></div>`;
    bindTop();$("#mk").onclick=()=>knownScreen(()=>runDrill(c));$("#all").onclick=()=>runDrill(c,true);return}
  const pool=useAll?genPhrases(c,false):known;
  const picks=[];while(picks.length<20){const sh=shuffle(pool);if(picks.length&&sh[0]===picks[picks.length-1])sh.push(sh.shift());picks.push(...sh)}
  const types=shuffle([...Array(20)].map((_,i)=>["say","build","choice"][i%3]));
  const tasks=picks.slice(0,20).map((x,i)=>{const ty=types[i];
    if(ty==="choice"){const q=drillChoice(c,x);if(q)return q}
    if(ty==="build")return {type:"build",hint:"Собери фразу",ru:x.ru,chunks:chunkify(x.en,c.say),en:x.en,consId:c.id,why:c.simple};
    return {type:"say",ru:x.ru,en:x.en,consId:c.id,pit:c.pitPlain}});
  runBlock({title:`${c.en} ×20`,phases:[{mode:"train",tasks:[{type:"ccard",cons:c},...tasks]}],onFinish:ph=>{
    showTabs(false);
    view.innerHTML=`<div class="stack center" style="padding-top:40px"><div class="eyebrow">Тренажёр · 20 повторов</div><h1>${esc(c.en)}</h1>
      <div class="score" style="color:${ph[0].result.pct>=80?"var(--good)":"var(--warn)"}">${ph[0].result.pct}%</div><p class="muted">с первого раза</p></div>
      <div class="foot"><button class="btn primary" id="again">Ещё 20</button><button class="btn ghost" id="list">Другая конструкция</button></div>`;
    $("#again").onclick=()=>runDrill(c,useAll);$("#list").onclick=drill}});
}

/* ================= CHATGPT PROMPT ================= */
/* Промпт для ОДНОГО постоянного чата: каждый раз полный срез знаний, поэтому ChatGPT ничего не нужно помнить */
const DAY=864e5;
function knowledge(){
  const items=[...ALLW().map(x=>({k:"w",x,s:wStat(x.id)})),...CONS.map(x=>({k:"c",x,s:cStat(x.id)}))].filter(i=>i.s.status!=="new");
  const since=S.lastPromptAt||0,now=Date.now();
  let fresh=since?items.filter(i=>!i.s.known&&i.s.at&&i.s.at>since):[],freshWhy="с прошлого промпта";
  if(!fresh.length){fresh=items.filter(i=>!i.s.known&&i.s.at&&now-i.s.at<2*DAY);freshWhy="за последние 2 дня"}
  /* не больше 12 слов и 4 конструкций, самые свежие; остальное уходит в повторение */
  fresh.sort((a,b)=>b.s.at-a.s.at);fresh=[...fresh.filter(i=>i.k==="w").slice(0,12),...fresh.filter(i=>i.k==="c").slice(0,4)];
  const old=items.filter(i=>!fresh.includes(i));
  const weak=old.filter(i=>(i.s.bad||0)>0).sort((a,b)=>(b.s.bad||0)-(a.s.bad||0)).slice(0,6);
  const review=[...weak,...shuffle(old.filter(i=>!weak.includes(i)&&!i.s.known)).slice(0,10-weak.length)];
  const psOn=S.tense.ps.stage>0||S.tense.ps.answers.length>0,psNew=psOn&&S.tense.ps.at&&(S.tense.ps.at>since||now-S.tense.ps.at<2*DAY);

/* ================= MY MISTAKES (с объяснением) ================= */
const RULE_OF={a1:"s",a2:"s",a3:"s",a4:"s",x1:"s",x2:"s",x3:"s",x7:"s",b1:"neg",b2:"neg",b3:"neg",x4:"neg",x6:"neg",x8:"neg",c1:"q",c2:"q",c3:"q",x5:"q",x9:"q",x10:"q",d1:"ord",d2:"ord",d3:"s"};
const RULES={
 s:{t:"-s после he / she / it",tip:"Говоришь про одного человека, но не про себя и не про собеседника (he, she, my brother, my family) — глагол получает -s: he lives. Про I, you, we, they и про нескольких (my parents) — без -s."},
 neg:{t:"Отрицание: don't / doesn't",tip:"I, you, we, they → don't. He, she, it → doesn't. После doesn't глагол всегда без -s: he doesn't live, а не doesn't lives."},
 q:{t:"Вопрос: Do / Does",tip:"Вопрос начинается с Do (I, you, we, they) или Does (he, she, it). После Does глагол без -s: Does he speak?"},
 ord:{t:"Порядок слов",tip:"Кто → действие → что → где → когда. Often, usually, always, never — перед глаголом."},
 w:{t:"Перевод слов",tip:"Слова путаются, когда похожи по смыслу или звучанию. Помогает своя ассоциация на карточке слова."},
 wa:{t:"Слова на слух",tip:"Похожие на слух слова лучше сравнить: послушай оба подряд и повтори вслух."},
 lw:{t:"Маленькие слова: путаницы",tip:"Смотри, что стоит рядом: вещь после слова (their car), кто делает (they) или кого (them). Для in / on / at: at — точка, on — поверхность и дни, in — внутри, города, месяцы."},
 link:{t:"Связки и целые фразы",tip:"Разбери фразу по частям: какая конструкция, какое время, кто действует."}
};
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};
function taskKey(t){return t.tenseId?"t:"+t.tenseId:t.wordId?"w:"+t.wordId+":"+(t.audio?"audio":t.hint||t.type):t.consId?"c:"+t.consId+":"+t.type+":"+(t.ru||t.prompt):"x:"+(t.ru||t.prompt)}
function ruleOf(t){if(t.id&&/^lp\d/.test(t.id))return "lw";if(t.tenseId)return RULE_OF[t.tenseId]||"s";if(t.wordId)return t.audio?"wa":"w";if(t.consId)return "c:"+t.consId;return "link"}
function ruleInfo(r){if(r.startsWith("c:")){const c=CONS.find(x=>x.id===r.slice(2));return {t:"Конструкция "+c.en,tip:c.simple+" "+c.pitPlain}}return RULES[r]}
const SNAP=["type","hint","prompt","ru","en","options","answer","notes","chunks","extra","why","pit","wordId","consId","tenseId","audio","say","sayAfter"];
function snapTask(t){const o={};SNAP.forEach(k=>{if(t[k]!==undefined&&t[k]!==null)o[k]=t[k]});return o}
function logError(t,picked){
  if(!["choice","build","say"].includes(t.type))return;
  const key=taskKey(t);let e=S.errors.find(x=>x.key===key);
  if(!e){e={key,rule:ruleOf(t),task:snapTask(t),n:0};S.errors.unshift(e)}
  e.n++;e.picked=picked;e.streak=0;e.fixed=false;e.date=today;save();
}
function logRight(t){const e=S.errors.find(x=>x.key===taskKey(t));if(e&&!e.fixed){e.streak=(e.streak||0)+1;if(e.streak>=2)e.fixed=true;save()}}
const openErrors=()=>S.errors.filter(e=>!e.fixed);
function errGroups(){const m={};openErrors().forEach(e=>{(m[e.rule]=m[e.rule]||{rule:ruleInfo(e.rule).t,key:e.rule,items:[],n:0});m[e.rule].items.push(e);m[e.rule].n+=e.n});return Object.values(m).sort((a,b)=>b.n-a.n)}
function explain(e){
  const t=e.task,p=e.picked||"";
  if(t.type==="choice"){
    const right=t.options[t.answer],i=t.options.indexOf(p);
    let why="";
    if(t.notes){why=(i>=0&&i!==t.answer?`«${p}»: ${t.notes[i]} `:"")+`Правильно «${right}»: ${t.notes[t.answer]}`}
    else if(t.wordId){const pool=ALLW(),rw=pool.find(w=>w.id===t.wordId),pw=(rw.pool||pool).find(w=>w.ru===p||w.en===p);
      if(t.audio)why=`Прозвучало «${rw.en}»${rw.tr?" "+rw.tr:""} — «${rw.ru}». Ты выбрал «${p}»${pw?" "+pw.tr:""}. Послушай оба слова подряд и сравни.`;
      else if(t.ru)why=`«${t.prompt}» по-английски — ${rw.en}${rw.tr?" "+rw.tr:""}.${pw?` А ${pw.en} значит «${pw.ru}».`:""}`;
      else why=`${rw.en} значит «${rw.ru}».${pw?` А «${pw.ru}» по-английски — ${pw.en}.`:""}`}
    return {q:t.audio?"Слово на слух":t.prompt,yours:p,right,why}}
  if(t.type==="build")return {q:t.ru,yours:p?(p.startsWith("поставил")?p[0].toUpperCase()+p.slice(1):p):"",right:sentence(t),why:t.why||""};
  return {q:t.ru,yours:"Сказал иначе или забыл",right:t.en,why:t.pit||"Повтори правильную фразу вслух 3 раза: медленно, потом в обычном темпе."};
}
function errorsScreen(){
  showTabs(false);const groups=errGroups(),fixed=S.errors.filter(e=>e.fixed);
  view.innerHTML=`${topBar(0,"Мои ошибки")}<div class="stack">
   <div><div class="eyebrow">Разбор</div><h1 style="margin-top:6px">Мои ошибки</h1>
   <p class="muted" style="margin-top:6px">${openErrors().length?`${openErrors().length} ${plural(openErrors().length,"ошибка","ошибки","ошибок")} в ${groups.length} ${plural(groups.length,"правиле","правилах","правилах")}. Ошибка уходит в «Исправлено», когда ответишь верно 2 раза подряд.`:"Ошибок пока нет. Всё, в чём ошибёшься на тренировках и тестах, появится здесь с объяснением."}</p></div>
   ${openErrors().length?`<button class="btn primary" id="fix">Потренировать ошибки</button>`:""}
   ${groups.map(g=>{const info=ruleInfo(g.key);return `<div class="panel stack egroup"><div class="row" style="justify-content:space-between;align-items:flex-start"><h3>${esc(g.rule)}</h3><span class="chip bad">×${g.n}</span></div>
     <div class="rule" style="font-size:14px">${esc(info.tip)}</div>
     ${g.items.map(e=>{const x=explain(e);return `<div class="ecard"><div class="eq">${esc(x.q)}</div>
       ${x.yours?`<div class="ey"><span>Ты</span>${esc(x.yours)}</div>`:""}<div class="er"><span>Верно</span>${esc(x.right)}</div>
       ${x.why?`<div class="ew"><b>Почему:</b> ${esc(x.why)}</div>`:""}<div class="muted" style="font-size:12px">ошибся ${e.n} ${plural(e.n,"раз","раза","раз")}${e.streak?` · верно подряд: ${e.streak} из 2`:""}</div></div>`}).join("")}</div>`}).join("")}
   ${fixed.length?`<details class="panel"><summary style="cursor:pointer;font-weight:600">Исправлено (${fixed.length})</summary><div class="stack" style="margin-top:10px">${fixed.map(e=>{const x=explain(e);return `<div class="muted" style="font-size:14px">✓ ${esc(x.q)} → ${esc(x.right)}</div>`}).join("")}</div></details>`:""}
  </div>`;
  bindTop();
  const f=$("#fix");if(f)f.onclick=()=>runBlock({title:"Работа над ошибками",phases:[{mode:"train",intro:{eyebrow:"Мои ошибки",title:"Работа над ошибками",text:"Только то, где ты ошибался. Два верных ответа подряд — и ошибка исправлена."},
    tasks:shuffle(openErrors()).slice(0,12).map(e=>{const t={...e.task};if(t.type==="choice"&&t.wordId&&!t.notes){const o=shuffle(t.options);t.answer=o.indexOf(t.options[t.answer]);t.options=o}return t})}],onFinish:()=>errorsScreen()});
}

const STAGES=[{t:"Этап 1 · Основа",from:0,to:8},{t:"Этап 2 · Жизнь и общение",from:9,to:24},{t:"Этап 3 · Серьёзные темы",from:25,to:40},{t:"Этап 4 · Продвинутый",from:41,to:44}];
const curTopicIdx=()=>{const i=TOPICS.findIndex(t=>!S.topicsDone.includes(t.id));return i<0?TOPICS.length:i};

/* Папка темы появляется, когда тема открыта. Первая открыта всегда, следующие — после теста по предыдущей */
const topicOpen=(t,i)=>i===0||t.words.some(w=>wStat(w.id).status!=="new")||S.topicsOpen&&S.topicsOpen.includes(t.id);
let dictAt=null;

  if(dictAt)return dictFolder(dictAt);
  const open=TOPICS.filter(topicOpen);
  const folder=(id,title,sub,count)=>`<button class="folder" data-f="${id}"><span class="ficon">${FOLDER_SVG}</span><span style="min-width:0"><b>${esc(title)}</b><span>${esc(sub)}</span></span><span class="fcount">${count}</span></button>`;
  view.innerHTML=`<div class="head"><div><div class="eyebrow">Словарь</div><h1 style="margin-top:4px">Папки</h1></div></div>
  <div class="eyebrow" style="margin-bottom:8px">Темы · ${open.length} из ${TOPIC_NAMES.length}</div>
  <div class="folders">${open.map(t=>{const d=t.words.filter(w=>wStat(w.id).status!=="new").length;return folder(t.id,t.en,t.ru,`${d}/${t.words.length}`)}).join("")}</div>
  <p class="muted" style="font-size:13px;margin:10px 2px 0">Новые темы появляются здесь сами, когда ты до них доходишь.</p>
  <div class="eyebrow" style="margin:22px 0 8px">Ещё</div>
  <div class="folders">${folder("basics","Basics","Базовые слова",`${BANK.filter(w=>wStat(w.id).status!=="new").length}/${BANK.length}`)}${folder("cons","Constructions","Конструкции",CONS.length)}${folder("custom","My words","Мои слова",S.custom.length)}</div>`;
  view.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{dictAt=b.dataset.f;dictFolder(dictAt)});
}

  if(id==="cons"){
    view.innerHTML=`${top("Constructions")}<div class="list">${CONS.map(c=>`${c===CONS.find(x=>x.g===c.g)?`<h2 style="margin:16px 0 4px">${esc(c.g)}</h2>`:""}<div class="li"><div><div class="en">${esc(c.en)} ${statusChip(cStat(c.id).status)}</div><div class="ru">${esc(c.ru)}</div></div><div class="acts"><button class="icon-btn" data-say="${esc(c.say)}" aria-label="Озвучить">${SPK}</button><button class="btn small ghost" data-dr="${c.id}">Прогнать</button></div></div>`).join("")}</div>`;

  if(id==="basics"){
    view.innerHTML=`${top("Basics")}<button class="btn ghost" id="kw" style="margin-bottom:10px">Отметить, что я уже знаю</button>
    ${BANK_CATS.map(([cat])=>`<h2 style="margin:16px 0 4px">${esc(cat)}</h2><div class="list">${BANK.filter(w=>w.cat===cat).map(w=>`<button class="li" data-w="${w.id}" style="text-align:left"><div><div class="en">${esc(w.en)} ${statusChip(wStat(w.id).status)}</div><div class="ru">${esc(w.ru)}</div></div><span class="muted">›</span></button>`).join("")}</div>`).join("")}`;
    bind();$("#kw").onclick=()=>knownScreen(()=>{dictAt="basics";go("dict")});

  if(id==="custom"){
    view.innerHTML=`${top("My words")}

    ${S.custom.length?`<div class="list" style="margin-top:12px">${S.custom.map((w,i)=>`<button class="li" data-cw="${i}" style="text-align:left"><div><div class="en">${esc(w.en)}</div><div class="ru">${esc(w.ru)}${S.assoc["u"+i]?" · есть ассоциация":""}</div></div><span class="muted">›</span></button>`).join("")}</div>`:`<p class="muted" style="margin-top:14px">Пока пусто. Встретил новое слово — добавь сюда.</p>`}`;
    bind();

    view.querySelectorAll("[data-cw]").forEach(b=>b.onclick=()=>{const i=+b.dataset.cw;const w=S.custom[i];wordDetail({id:"u"+i,en:w.en,ru:w.ru,tr:"",ex:"",exRu:""},"custom")});
    return}
  const t=TOPICS.find(x=>x.id===id);
  view.innerHTML=`${top(t.en)}<p class="muted" style="margin:-6px 0 8px">${esc(t.ru)} · нажми на слово, чтобы открыть карточку</p>
   <div class="list">${t.words.map(w=>`<button class="li" data-w="${w.id}" style="text-align:left"><div style="min-width:0"><div class="en">${esc(w.en)} ${statusChip(wStat(w.id).status)}</div><div class="ru"><span style="color:var(--accent)">${esc(w.tr)}</span> · ${esc(w.ru)}${S.assoc[w.id]?' · <span style="color:var(--good)">ассоциация</span>':""}</div></div><span class="muted">›</span></button>`).join("")}</div>`;
  bind();

function wordDetail(w,folderId){
  view.innerHTML=`<div class="rtop" style="margin-bottom:14px"><button class="x" id="wback" aria-label="Назад в папку">${BACK}</button><div class="rlabel" style="flex:1">Карточка слова</div></div>

    ${w.ex?`<div class="ex"><div style="font-size:17px">${tt(w.ex)}</div><div class="muted">${esc(w.exRu)}</div>${spkBtn(w.ex,"Фраза")}</div>`:""}

/* Своя ассоциация: показать, добавить, изменить. Живёт в прогрессе, доступна и в уроке, и в словаре */
function assocBlock(w,el,editing=false){
  const cur=S.assoc[w.id]||"";
  if(editing||!cur&&el.dataset.open){
    el.innerHTML=`<div class="sec"><div class="eyebrow">Моя ассоциация</div>
      <textarea id="as-${w.id}" class="assoc-in" placeholder="Например: name — «нейм» → «на мне» написано имя">${esc(cur)}</textarea>
      <div class="row"><button class="btn small primary" data-as="save">Сохранить</button><button class="btn small ghost" data-as="cancel">Отмена</button>${cur?'<button class="btn small ghost" data-as="del" style="color:var(--bad)">Удалить</button>':""}</div></div>`;
    const ta=el.querySelector("textarea");ta.focus();
    el.querySelector('[data-as="save"]').onclick=e=>{e.stopPropagation();const v=ta.value.trim();if(v)S.assoc[w.id]=v;else delete S.assoc[w.id];save();toast(v?"Ассоциация сохранена":"Ассоциация удалена");delete el.dataset.open;assocBlock(w,el)};
    el.querySelector('[data-as="cancel"]').onclick=e=>{e.stopPropagation();delete el.dataset.open;assocBlock(w,el)};
    const d=el.querySelector('[data-as="del"]');if(d)d.onclick=e=>{e.stopPropagation();delete S.assoc[w.id];save();toast("Ассоциация удалена");assocBlock(w,el)};
    el.onclick=e=>e.stopPropagation();
    return}
  el.innerHTML=cur
    ?`<div class="sec"><div class="row" style="justify-content:space-between"><div class="eyebrow">Моя ассоциация</div><button class="btn small ghost" data-as="edit">Изменить</button></div><p class="assoc-txt">${esc(cur)}</p></div>`
    :`<div class="sec"><button class="btn ghost" data-as="add">+ Вписать свою ассоциацию</button></div>`;
  el.querySelector("[data-as]").onclick=e=>{e.stopPropagation();el.dataset.open="1";assocBlock(w,el,true)};
}

function stats(){
  const cnt=(ids,get)=>{const r={learned:0,learning:0,new:0};ids.forEach(id=>r[get(id).status]++);return r};
  const w=cnt(WORDS.map(x=>x.id),wStat),c=cnt(CONS.map(x=>x.id),cStat);
  const a=S.tense.ps.answers,pct=a.length?Math.round(a.reduce((s,x)=>s+x,0)/a.length*100):null;
  const col=p=>p==null?"var(--line)":p>85?"var(--good)":p>=60?"var(--warn)":"var(--bad)";
  const grid=r=>`<div class="statgrid"><div><b style="color:var(--good)">${r.learned}</b><span>выучено</span></div><div><b style="color:var(--warn)">${r.learning}</b><span>в процессе</span></div><div><b>${r.new}</b><span>не начато</span></div></div>`;
  view.innerHTML=`<div class="head"><div><div class="eyebrow">Статистика</div><h1 style="margin-top:4px">Прогресс</h1></div></div>
  <div class="stack">
  <div class="panel"><h3>Слова</h3>${grid(w)}<div class="tense" style="border:0;padding-bottom:0"><span>${TOPIC.title}</span><span class="muted" style="font-variant-numeric:tabular-nums">${w.learned+w.learning}/${TOPIC.total}</span><div class="bar"><i style="width:${(w.learned+w.learning)/TOPIC.total*100}%"></i></div></div></div>
  <div class="panel"><h3>Конструкции</h3>${grid(c)}</div>
  <div class="panel"><h3>Времена</h3><p class="muted" style="margin:4px 0 6px;font-size:13px">По последним 30 ответам. Зелёный больше 85%, жёлтый 60–85%, красный меньше 60%.</p>
   ${TENSES.map((t,i)=>i===0?`<div class="tense"><span>${t}</span><span style="color:${col(pct)};font-weight:700;font-variant-numeric:tabular-nums">${pct==null?"нет ответов":pct+"%"}</span><div class="bar"><i style="width:${pct||0}%;background:${col(pct)}"></i></div></div>`
     :`<div class="tense locked"><span>${t}</span><span class="muted">закрыто</span></div>`).join("")}
  </div>
  <div class="panel"><h3>Где ошибаешься чаще всего</h3>${errGroups().slice(0,3).map(g=>`<div class="tense"><span>${esc(g.rule)}</span><span class="chip bad">${g.n} ${plural(g.n,"ошибка","ошибки","ошибок")}</span></div>`).join("")||'<p class="muted" style="margin-top:6px">Ошибок пока нет.</p>'}
  ${openErrors().length?`<button class="btn ghost" id="toerr" style="margin-top:12px">Открыть «Мои ошибки»</button>`:""}
  ${pct!=null&&pct<=85?`<button class="btn ghost" id="weak" style="margin-top:12px">Тренировать слабые места</button>`:""}</div>
  </div>`;
  const te=$("#toerr");if(te)te.onclick=errorsScreen;
  const wk=$("#weak");if(wk)wk.onclick=()=>runBlock({title:"Слабые места",phases:[{mode:"train",tasks:shuffle(TI.filter(t=>t.type!=="say")).slice(0,10).map(tag)}],onFinish:ph=>resultScreen("Слабые места",ph)});
}
