<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Английский Дани</title>
<style>body{margin:0;background:#0E1316;color:#8D9B9F;font:15px system-ui,sans-serif;display:grid;place-items:center;height:100vh}</style>
</head><body>Загрузка…
<script>
/* Загрузчик: каждый раз сверяет версию с сервером (no-cache = проверка по ETag), так что старая версия не застрянет, а неизменённый файл не качается заново */
(function(){var u="app.html";
fetch(u,{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
.then(function(h){document.open();document.write(h);document.close()})
.catch(function(){location.replace(u+"?v="+Date.now()+location.hash)})})();
</script></body></html>
